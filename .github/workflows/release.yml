name: Build ArturaLabs

on:
  push:
    tags: ['v*']
  workflow_dispatch:          # lets you run it manually from the Actions tab

permissions:
  contents: write

jobs:

  # Runs the real app on a virtual screen and photographs every page.
  # If the stylesheet fails to load, this job fails and no release goes out.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run fonts
      - name: Screenshot every screen
        run: xvfb-run --auto-servernum --server-args="-screen 0 1400x900x24" npm run screenshots
        env:
          ARTURA_SCREENSHOT_DIR: ${{ github.workspace }}/screenshots
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/*.png
          if-no-files-found: error

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            cmd: dist:win
            out: dist/*.exe
          - os: macos-latest
            cmd: dist:mac
            out: dist/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run ${{ matrix.cmd }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Fill these in once you buy certificates, and the warnings disappear:
          # CSC_LINK: ${{ secrets.CSC_LINK }}
          # CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          path: ${{ matrix.out }}
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: artifacts }
      - name: Publish the download page
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.exe
            artifacts/**/*.dmg
          generate_release_notes: true
          body: |
            ## Download ArturaLabs

            **Windows** — download the `.exe`, double-click, follow the installer.
            **Mac** — download the `.dmg`, drag ArturaLabs into Applications.

            ### First launch

            This build is not yet code-signed, so your computer will warn you once.

            **Windows:** "Windows protected your PC" → click **More info** → **Run anyway**
            **Mac:** right-click the app → **Open** → **Open**

            You only do this the first time.
